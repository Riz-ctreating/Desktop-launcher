name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Siapkan proyek Capacitor
        run: |
          mkdir -p www
          cp launcher-desktop.html www/index.html
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/app-launcher@6
          npx cap init "Launcher Desktop" com.rizal.launcher --web-dir www
          npx cap add android
          npx cap sync android
      - name: Pasang plugin ikon dan daftar aplikasi
        run: |
          D=android/app/src/main/java/com/rizal/launcher
          ls $D
          cp IconPlugin.java MainActivity.java $D/
      - name: Atur manifest (layar utama, landscape, izin buka aplikasi lain)
        run: |
          F=android/app/src/main/AndroidManifest.xml
          sed -i 's#<category android:name="android.intent.category.LAUNCHER" />#<category android:name="android.intent.category.LAUNCHER" />\n                <category android:name="android.intent.category.HOME" />\n                <category android:name="android.intent.category.DEFAULT" />#' $F
          sed -i 's#android:launchMode="singleTask"#android:launchMode="singleTask" android:screenOrientation="sensorLandscape"#' $F
          sed -i 's#<application#<uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />\n    <application#' $F
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
