name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Siapkan proyek Capacitor
        run: |
          mkdir -p www
          cp launcher-desktop.html www/index.html
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/app-launcher@6
          npx cap init "Launcher Desktop" com.rizal.launcher --web-dir www
          npx cap add android
          npx cap sync android
      - name: Plugin ikon dan daftar aplikasi
        run: |
          D=android/app/src/main/java/com/rizal/launcher
          cat > $D/IconPlugin.java <<'EOF'
          package com.rizal.launcher;

          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.drawable.Drawable;
          import android.util.Base64;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.ByteArrayOutputStream;
          import java.util.List;

          @CapacitorPlugin(name = "IconPlugin")
          public class IconPlugin extends Plugin {
            @PluginMethod
            public void getIcon(PluginCall call) {
              String pkg = call.getString("pkg");
              if (pkg == null) { call.reject("no pkg"); return; }
              try {
                Drawable d = getContext().getPackageManager().getApplicationIcon(pkg);
                int s = 96;
                Bitmap b = Bitmap.createBitmap(s, s, Bitmap.Config.ARGB_8888);
                Canvas c = new Canvas(b);
                d.setBounds(0, 0, s, s);
                d.draw(c);
                ByteArrayOutputStream o = new ByteArrayOutputStream();
                b.compress(Bitmap.CompressFormat.PNG, 100, o);
                JSObject r = new JSObject();
                r.put("data", "data:image/png;base64," + Base64.encodeToString(o.toByteArray(), Base64.NO_WRAP));
                call.resolve(r);
              } catch (Exception e) {
                call.reject("not found");
              }
            }

            @PluginMethod
            public void getApps(PluginCall call) {
              try {
                PackageManager pm = getContext().getPackageManager();
                Intent i = new Intent(Intent.ACTION_MAIN);
                i.addCategory(Intent.CATEGORY_LAUNCHER);
                List<ResolveInfo> list = pm.queryIntentActivities(i, 0);
                String me = getContext().getPackageName();
                JSArray arr = new JSArray();
                for (ResolveInfo ri : list) {
                  String p = ri.activityInfo.packageName;
                  if (p.equals(me)) continue;
                  JSObject o = new JSObject();
                  o.put("label", ri.loadLabel(pm).toString());
                  o.put("pkg", p);
                  arr.put(o);
                }
                JSObject res = new JSObject();
                res.put("apps", arr);
                call.resolve(res);
              } catch (Exception e) {
                call.reject("gagal");
              }
            }
          }
          EOF
          cat > $D/MainActivity.java <<'EOF'
          package com.rizal.launcher;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(IconPlugin.class);
              super.onCreate(savedInstanceState);
            }
          }
          EOF
      - name: Atur manifest (layar utama, landscape, izin buka aplikasi lain)
        run: |
          F=android/app/src/main/AndroidManifest.xml
          sed -i 's#<category android:name="android.intent.category.LAUNCHER" />#<category android:name="android.intent.category.LAUNCHER" />\n                <category android:name="android.intent.category.HOME" />\n                <category android:name="android.intent.category.DEFAULT" />#' $F
          sed -i 's#android:launchMode="singleTask"#android:launchMode="singleTask" android:screenOrientation="sensorLandscape"#' $F
          sed -i 's#<application#<uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />\n    <application#' $F
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
